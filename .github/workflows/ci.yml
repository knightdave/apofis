name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I -m unittest discover -s server/apofis-push -p 'test_*.py' -v
      - run: python3 -I -m unittest discover -s tools/emulator -p 'test_*.py' -v
      # The harness's own safeguards: fake ssh and rsync, a fake key, synthetic databases; no host, emulator or server.
      - run: bash tools/emulator/run-e2e-selftest.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - id: sdk
        run: scripts/sdk-versions.sh >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@v4
        with:
          packages: ${{ steps.sdk.outputs.packages }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew lintDebug testDebugUnitTest verifyRoborazziDebug assembleDebug
      # Release runs only the shipping policy check; the rest of the suite needs the debug-only Compose test host.
      - run: ./gradlew testReleaseUnitTest --tests 'xyz.rycerz.apofis.push.ReleasePolicyTest'
      - run: bash scripts/check-apk-permissions-test.sh
      - run: scripts/release-lock-test.sh
      - run: bash scripts/check-apk-permissions.sh "$ANDROID_HOME/build-tools/${{ steps.sdk.outputs.build_tools }}/aapt2" app/build/outputs/apk/debug/app-debug.apk
      # Tag guard, certificate check and tag procedure against temporary repositories, throwaway keys and a stub gh.
      - run: scripts/release-guards-test.sh "$ANDROID_HOME/build-tools/${{ steps.sdk.outputs.build_tools }}/apksigner" app/build/outputs/apk/debug/app-debug.apk

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Per-ref groups: a newer pending main run may replace an older pending one
    # (saves building pre-releases that would be skipped anyway), and no ref can
    # cancel another ref's run. Release ordering is enforced by the publish lock.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Pinned to commits; the comment names the release each commit is.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag guard needs origin/main and the tag object

      # Before any secret: a tag must be a signed vX.Y.Z on a commit of main; any other ref but main stops.
      - name: Check release ref
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git fetch --no-tags origin "+$GITHUB_REF:$GITHUB_REF"
            scripts/check-release-tag.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are built only for main and v tags, not $GITHUB_REF"
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - id: sdk
        run: scripts/sdk-versions.sh >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ${{ steps.sdk.outputs.packages }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Set version
        run: |
          echo "APOFIS_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "APOFIS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "APOFIS_VERSION_NAME=0.1.0-pre.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=pre-${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.APOFIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APOFIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APOFIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APOFIS_KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "$(printenv "$v")" ] || missing="$missing APOFIS_$v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty signing secrets:$missing"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.APOFIS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apofis.jks"
          echo "APOFIS_KEYSTORE_FILE=$RUNNER_TEMP/apofis.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          APOFIS_KEYSTORE_PASSWORD: ${{ secrets.APOFIS_KEYSTORE_PASSWORD }}
          APOFIS_KEY_ALIAS: ${{ secrets.APOFIS_KEY_ALIAS }}
          APOFIS_KEY_PASSWORD: ${{ secrets.APOFIS_KEY_PASSWORD }}
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease

      - name: Check permissions
        run: bash scripts/check-apk-permissions.sh "$ANDROID_HOME/build-tools/${{ steps.sdk.outputs.build_tools }}/aapt2" app/build/outputs/apk/release/app-release.apk

      # A mismatch is a stop for the owner, never a reason to change the recorded digest (RELEASING.md).
      - name: Check signing certificate
        run: scripts/check-signing-cert.sh "$ANDROID_HOME/build-tools/${{ steps.sdk.outputs.build_tools }}/apksigner" app/build/outputs/apk/release/app-release.apk release/signing-cert.sha256

      - name: Acquire publish lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-lock.sh acquire

      # Critical section: stale versionCode check and publication. The timeout keeps a
      # live holder well under the lock's 20 minute stale age.
      - name: Publish release
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-release.sh app/build/outputs/apk/release/app-release.apk

      - name: Release publish lock
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-lock.sh release
