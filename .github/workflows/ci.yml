name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - id: sdk
        run: scripts/sdk-versions.sh >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@v4
        with:
          packages: ${{ steps.sdk.outputs.packages }}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew lintDebug testDebugUnitTest assembleDebug
      - run: scripts/check-apk-permissions-test.sh
      - run: scripts/check-apk-permissions.sh "$ANDROID_HOME/build-tools/${{ steps.sdk.outputs.build_tools }}/aapt2" app/build/outputs/apk/debug/app-debug.apk

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    # Main pushes share one group, so a newer pending main run may replace an older
    # pending one (fine for pre-releases). Each tag gets its own group, so a tag
    # release is never cancelled. Ordering across groups is enforced by the
    # "Wait for older publishers" and "Reject stale versionCode" steps.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - id: sdk
        run: scripts/sdk-versions.sh >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@v4
        with:
          packages: ${{ steps.sdk.outputs.packages }}
      - uses: gradle/actions/setup-gradle@v6

      - name: Set version
        run: |
          echo "APOFIS_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "APOFIS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "APOFIS_VERSION_NAME=0.1.0-pre.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=pre-${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.APOFIS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APOFIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.APOFIS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.APOFIS_KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "$(printenv "$v")" ] || missing="$missing APOFIS_$v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty signing secrets:$missing"
            exit 1
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.APOFIS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apofis.jks"
          echo "APOFIS_KEYSTORE_FILE=$RUNNER_TEMP/apofis.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          APOFIS_KEYSTORE_PASSWORD: ${{ secrets.APOFIS_KEYSTORE_PASSWORD }}
          APOFIS_KEY_ALIAS: ${{ secrets.APOFIS_KEY_ALIAS }}
          APOFIS_KEY_PASSWORD: ${{ secrets.APOFIS_KEY_PASSWORD }}
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease

      - name: Check permissions
        run: scripts/check-apk-permissions.sh "$ANDROID_HOME/build-tools/${{ steps.sdk.outputs.build_tools }}/aapt2" app/build/outputs/apk/release/app-release.apk

      - name: Wait for older publishers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Publish in run-number order: wait until every older push run of this workflow
          # has finished. Older runs never wait for newer ones, so this cannot deadlock.
          for _ in $(seq 120); do
            older=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.status != \"completed\" and .run_number < $APOFIS_VERSION_CODE) | .run_number] | join(\" \")")
            [ -z "$older" ] && exit 0
            echo "Waiting for older runs: $older"
            sleep 30
          done
          echo "::error::Older runs still unfinished after 60 minutes: $older"
          exit 1

      - name: Reject stale versionCode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # versionCode is the run number: pre-N tags carry it, other releases record it in
          # their notes. A failed lookup fails this step (assignment keeps gh's exit status).
          codes=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] |
            (.tag_name | capture("^pre-(?<n>[0-9]+)$").n) //
            ((.body // "") | capture("versionCode: (?<n>[0-9]+)").n) // empty')
          newest=$(printf '%s\n' "$codes" | sort -n | tail -1)
          if [ -n "$newest" ] && [ "$newest" -ge "$APOFIS_VERSION_CODE" ]; then
            echo "::error::A release with versionCode $newest exists; refusing to publish $APOFIS_VERSION_CODE."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="apofis-$APOFIS_VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notes="versionCode: $APOFIS_VERSION_CODE"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$RELEASE_TAG" "$apk" --title "Apofis $APOFIS_VERSION_NAME" --notes "$notes" --generate-notes --verify-tag
          else
            gh release create "$RELEASE_TAG" "$apk" --title "Apofis $APOFIS_VERSION_NAME" --notes "$notes" --generate-notes --prerelease --target "$GITHUB_SHA"
          fi
