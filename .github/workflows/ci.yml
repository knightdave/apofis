name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew lintDebug testDebugUnitTest

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37.2 build-tools;37.0.0
      - uses: gradle/actions/setup-gradle@v6

      - name: Set version
        run: |
          echo "APOFIS_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "APOFIS_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "APOFIS_VERSION_NAME=0.1.0-pre.${{ github.run_number }}" >> "$GITHUB_ENV"
            echo "RELEASE_TAG=pre-${{ github.run_number }}" >> "$GITHUB_ENV"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.APOFIS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/apofis.jks"
          echo "APOFIS_KEYSTORE_FILE=$RUNNER_TEMP/apofis.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          APOFIS_KEYSTORE_PASSWORD: ${{ secrets.APOFIS_KEYSTORE_PASSWORD }}
          APOFIS_KEY_ALIAS: ${{ secrets.APOFIS_KEY_ALIAS }}
          APOFIS_KEY_PASSWORD: ${{ secrets.APOFIS_KEY_PASSWORD }}
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="apofis-$APOFIS_VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$RELEASE_TAG" "$apk" --title "Apofis $APOFIS_VERSION_NAME" --generate-notes --verify-tag
          else
            gh release create "$RELEASE_TAG" "$apk" --title "Apofis $APOFIS_VERSION_NAME" --generate-notes --prerelease --target "$GITHUB_SHA"
          fi
